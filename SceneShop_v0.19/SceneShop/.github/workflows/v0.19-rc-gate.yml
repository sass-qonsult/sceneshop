name: SceneShop v0.19 Release Candidate gate
on:
  workflow_dispatch:
  pull_request:
    branches: [ main, develop, "feature/v0.19-release-candidate", "release/v0.19" ]

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run preflight:rc
      - run: npm run rc:contract
      - run: npm run rc:schema
      - run: npm run test:rc19
      - run: npm run test:production-beta-apps

  live-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm run gate:foundation
      - run: npm run gate:recovery
      - uses: actions/upload-artifact@v4
        with:
          name: sceneshop-v019-live-evidence
          path: |
            artifacts/foundation-gate/*.json
            artifacts/recovery-gate/*.json
            artifacts/rc-gate/schema-compatibility.json
          if-no-files-found: error

  desktop-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build:app-packages
      - name: Record desktop build evidence
        run: |
          DESKTOP=$(find artifacts/app-packages -name 'SceneShop_Desktop_Host_*.zip' -type f | head -1)
          node tools/native-build-evidence.js --platform=desktop --artifact="$DESKTOP" --out=artifacts/native-build/desktop.json
      - uses: actions/upload-artifact@v4
        with:
          name: sceneshop-v019-desktop-evidence
          path: |
            artifacts/native-build/desktop.json
            artifacts/app-packages/*/SceneShop_Desktop_Host_*.zip
          if-no-files-found: error

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: npm ci
      - run: gradle -p apps/mobile/android :app:assembleDebug --no-daemon
      - name: Record Android build evidence
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          node tools/native-build-evidence.js --platform=android --artifact="$APK" --out=artifacts/native-build/android.json
      - uses: actions/upload-artifact@v4
        with:
          name: sceneshop-v019-android-evidence
          path: |
            artifacts/native-build/android.json
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios-build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: brew install xcodegen
      - name: Generate and build iOS simulator app
        working-directory: apps/mobile/ios
        run: |
          xcodegen generate
          xcodebuild -project SceneShopMobile.xcodeproj -scheme SceneShopMobile -sdk iphonesimulator -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package iOS simulator app and record evidence
        working-directory: apps/mobile/ios
        run: |
          mkdir -p ../../../artifacts/native-build
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -name 'SceneShopMobile.app' -type d | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" ../../../artifacts/native-build/SceneShopMobile-simulator.zip
          cd ../../..
          node tools/native-build-evidence.js --platform=ios --artifact=artifacts/native-build/SceneShopMobile-simulator.zip --out=artifacts/native-build/ios.json
      - uses: actions/upload-artifact@v4
        with:
          name: sceneshop-v019-ios-evidence
          path: |
            artifacts/native-build/ios.json
            artifacts/native-build/SceneShopMobile-simulator.zip
          if-no-files-found: error

  aggregate:
    needs: [repository, live-infrastructure, desktop-build, android-build, ios-build]
    runs-on: ubuntu-latest
    if: always() && needs.repository.result == 'success' && needs.live-infrastructure.result == 'success' && needs.desktop-build.result == 'success' && needs.android-build.result == 'success' && needs.ios-build.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: sceneshop-v019-live-evidence, path: artifacts/live-download }
      - uses: actions/download-artifact@v4
        with: { name: sceneshop-v019-desktop-evidence, path: artifacts/desktop-download }
      - uses: actions/download-artifact@v4
        with: { name: sceneshop-v019-android-evidence, path: artifacts/android-download }
      - uses: actions/download-artifact@v4
        with: { name: sceneshop-v019-ios-evidence, path: artifacts/ios-download }
      - name: Normalize evidence paths
        run: |
          mkdir -p artifacts/foundation-gate artifacts/recovery-gate artifacts/rc-gate artifacts/native-build
          cp $(find artifacts/live-download -name 'foundation-evidence-*.json' | head -1) artifacts/foundation-gate/
          cp $(find artifacts/live-download -name 'recovery-evidence-*.json' | head -1) artifacts/recovery-gate/
          cp $(find artifacts/live-download -name 'schema-compatibility.json' | head -1) artifacts/rc-gate/schema-compatibility.json
          cp $(find artifacts/desktop-download -name desktop.json | head -1) artifacts/native-build/desktop.json
          cp $(find artifacts/android-download -name android.json | head -1) artifacts/native-build/android.json
          cp $(find artifacts/ios-download -name ios.json | head -1) artifacts/native-build/ios.json
      - name: Build fail-closed RC manifest
        run: npm run rc:manifest
      - uses: actions/upload-artifact@v4
        with:
          name: sceneshop-v019-rc-manifest
          path: artifacts/rc-gate/v0.19-rc-manifest.json
          if-no-files-found: error
