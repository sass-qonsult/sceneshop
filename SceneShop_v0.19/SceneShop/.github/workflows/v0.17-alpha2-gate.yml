name: SceneShop v0.17 alpha.2 gate

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, develop, "feature/v0.17-scale-reliability-alpha2", "release/v0.17" ]

jobs:
  alpha2-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Run foundation + backup/restore/fresh-Redis gate
        run: bash tools/run-alpha2-gate.sh
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sceneshop-v0.17-alpha2-recovery-evidence
          path: artifacts/recovery-gate/
          if-no-files-found: warn
