<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SceneShop — Player</title>
  <link rel="stylesheet" href="/css/sdk.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #stage { position: fixed; inset: 0; }
  </style>
  <script src="/js/i18n-dict.js"></script>
  <script src="/js/i18n.js"></script>
</head>
<body>
  <!-- Qualquer player serve: o SDK só precisa do elemento <video>. -->
  <div id="stage">
    <video id="video" playsinline preload="auto" crossorigin="anonymous">
      <source src="/media/demo.webm" type="video/webm" />
      <source src="/media/demo.mp4" type="video/mp4" />
    </video>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/sceneshop-sdk.js"></script>
  <script src="/js/page-player.js"></script>
</body>
</html>
