<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assistir — SceneShop</title>
  <link rel="stylesheet" href="/css/sdk.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; font-family: system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; }
    #err { position: fixed; inset: 0; display: grid; place-items: center; color: #f3f3f7; text-align: center; padding: 24px; }
    #err[hidden] { display: none; }
    #err p { max-width: 560px; line-height: 1.5; color: #b8b8c8; }
  </style>
  <script src="/js/i18n-dict.js"></script>
  <script src="/js/i18n.js"></script>
</head>
<body>
  <!-- Player de uma obra do piloto: /assistir/<id-da-obra> -->
  <div id="stage"><video id="video" playsinline preload="auto"></video></div>
  <div id="err" hidden><div><h2 id="errTitle">Não foi possível abrir a obra</h2><p id="errMsg"></p></div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/sceneshop-sdk.js"></script>
  <script src="/js/page-assistir.js"></script>
</body>
</html>
