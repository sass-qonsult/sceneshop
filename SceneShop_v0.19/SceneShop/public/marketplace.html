<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marketplace Piloto</title>
  <link rel="stylesheet" href="/css/marketplace.css" />
  <script src="/js/i18n-dict.js"></script>
  <script src="/js/i18n.js"></script>
</head>
<body>
  <div class="topnote">Ambiente de demonstração do piloto SceneShop · nenhum pagamento real é feito</div>
  <header class="mh">
    <a class="logo" href="/marketplace"><span class="mark"></span>Marketplace <b>Piloto</b></a>
    <span data-lang-slot></span>
    <form class="search" id="searchForm" role="search">
      <input id="q" placeholder="Buscar produtos, marcas e mais…" aria-label="Buscar" />
      <button aria-label="Buscar"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </form>
    <a class="cart" href="/marketplace/carrinho" aria-label="Carrinho">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6"/></svg>
      <span id="cartCount">0</span>
    </a>
  </header>
  <main id="app" class="wrap"></main>
  <footer class="mf">Marketplace Piloto é uma loja fictícia usada para demonstrar a integração com o SceneShop.</footer>
  <script src="/js/wallet-pay.js"></script>
  <script src="/js/marketplace.js"></script>
</body>
</html>
