name: SceneShopMobile
options:
  bundleIdPrefix: io.sceneshop
targets:
  SceneShopMobile:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [SceneShopMobile]
    dependencies:
      - target: SceneShopShareExtension
        embed: true
    info:
      path: SceneShopMobile/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sceneshop.mobile
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: 0.19.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_ENTITLEMENTS: SceneShopMobile/SceneShopMobile.entitlements
  SceneShopShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources: [SceneShopShareExtension]
    info:
      path: SceneShopShareExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sceneshop.mobile.share
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: 0.19.0
        CURRENT_PROJECT_VERSION: 1
