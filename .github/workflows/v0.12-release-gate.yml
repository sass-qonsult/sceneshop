name: SceneShop v0.12 release gate

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, develop, "release/v0.12" ]

jobs:
  rc-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: sceneshop
          POSTGRES_PASSWORD: sceneshop
          POSTGRES_DB: sceneshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sceneshop -d sceneshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LIVE_DATABASE_URL: postgresql://sceneshop:sceneshop@127.0.0.1:5432/sceneshop
      LIVE_REDIS_URL: redis://127.0.0.1:6379
      SCENESHOP_MEMORY: "1"
      DEMO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependency tree
        run: npm ci
      - name: Unit and contract regression
        run: npm test
      - name: HTTP integration
        run: npm run test:api
      - name: Strict release preflight
        run: npm run preflight:rc
      - name: Live PostgreSQL + Redis validation
        run: npm run validate:live
