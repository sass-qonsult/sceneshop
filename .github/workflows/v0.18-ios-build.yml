name: SceneShop v0.18 iOS build
on:
  workflow_dispatch:
  pull_request:
    branches: [ main, develop, "feature/v0.18-production-beta-lifecycle", "release/v0.18" ]
jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run test:native-apps
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/mobile/ios
        run: xcodegen generate
      - name: Build iOS simulator app
        working-directory: apps/mobile/ios
        run: xcodebuild -project SceneShopMobile.xcodeproj -scheme SceneShopMobile -sdk iphonesimulator -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app and record evidence
        working-directory: apps/mobile/ios
        run: |
          mkdir -p ../../../artifacts/native-build
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -name 'SceneShopMobile.app' -type d | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" ../../../artifacts/native-build/SceneShopMobile-simulator.zip
          cd ../../..
          node tools/native-build-evidence.js --platform=ios --artifact=artifacts/native-build/SceneShopMobile-simulator.zip --out=artifacts/native-build/ios.json
      - uses: actions/upload-artifact@v4
        with:
          name: sceneshop-ios-simulator
          path: |
            artifacts/native-build/SceneShopMobile-simulator.zip
            artifacts/native-build/ios.json
          if-no-files-found: error
