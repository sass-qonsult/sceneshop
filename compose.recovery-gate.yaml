services:
  postgres:
    ports:
      - "127.0.0.1:55432:5432"

  redis:
    ports:
      - "127.0.0.1:56379:6379"

  postgres_restore:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: sceneshop_restore
      POSTGRES_USER: sceneshop
      POSTGRES_PASSWORD: sceneshop_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sceneshop -d sceneshop_restore"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:55433:5432"

  redis_fresh:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:56380:6379"
